// Types from admob-cmp-core that cross a @Composable boundary.
//
// admob-cmp-core is deliberately Compose-free (shipped as the core/compose split in 1.0.2), so
// its classes are compiled without the Compose compiler plugin and carry no @StabilityInferred
// metadata. The Compose compiler therefore treats every one of them as unstable by default,
// which makes BannerAdView, NativeAdView, and AdDebugScreen non-skippable regardless of how
// well-behaved the actual values are at runtime.
//
// Stability here is a promise the compiler trusts without checking — every entry below is
// either an all-`val` data class/interface or an interface whose public properties are
// StateFlow references of constant identity. See KDoc on each type for the specific contract
// (e.g. AdRequestOptions's collections must not be mutated after construction). Verify a new
// entry against the compose-reports output (see build.gradle.kts) before adding it, and do not
// wildcard `dev.avinya.ads.*` — that would promise mutable internals too.
//
// AdEvent is deliberately NOT listed. It is a sealed interface with 14 data-class subclasses
// (PaidEvent -> AdValue, AdResponseInfo, ...) and is not load-bearing for any current
// composable — every place it appears is a plain, already-stable Kotlin function type
// (`onEvent: (AdEvent) -> Unit`). A blanket AdEvent entry would be an unaudited promise across
// 14 types for no current benefit. Add it only when a composable takes an AdEvent value
// directly, and audit the subclasses first.
//
// Comments in this file must use `//` at the start of a line — the Compose compiler's config
// parser rejects `#` as an invalid pattern (verified: it errored on this exact file with `#`).

dev.avinya.ads.AdPlacement
dev.avinya.ads.AdUnitIds
dev.avinya.ads.AdRequestOptions
dev.avinya.ads.AdCachePolicy
dev.avinya.ads.AdExpirationPolicy
dev.avinya.ads.AdRetryPolicy
dev.avinya.ads.AdTimeoutPolicy
dev.avinya.ads.AdSizePolicy
dev.avinya.ads.BannerRefreshPolicy
dev.avinya.ads.FullScreenAdOptions
dev.avinya.ads.nativead.NativeAdOptions

// AdError reaches Compose through NativeAdView's `failure: @Composable (AdError) -> Unit`,
// which generates its own restart scope keyed on AdError's stability. Its transitive graph is
// listed too: AdError -> AdResponseInfo -> Map<String,String> + List<AdNetworkResponseInfo>.
// These are SDK-constructed only (never handed a mutable collection by a consumer) — the
// mapper call sites (IosAdMappers.kt / the Android equivalent) carry a comment noting that the
// promise here depends on them staying that way.
dev.avinya.ads.AdError
dev.avinya.ads.AdResponseInfo
dev.avinya.ads.AdNetworkResponseInfo

// Interfaces held across recomposition. Stable because their public properties are StateFlow
// references of constant identity — mutation is observed only through collectAsState(), never
// by an unnotified property write.
dev.avinya.ads.AdManager
dev.avinya.ads.nativead.NativeAdSession
