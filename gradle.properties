#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# admob-cmp commonizes its GoogleMobileAds/UMP cinterops across the iOS targets.
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# admob-cmp iOS interop header archive checksums. Pinned SHA-256 of the exact zip bytes
# from Google's unauthenticated endpoints; the build fails closed on mismatch. Bump ONLY
# after downloading the new archive yourself and recording its real hash.
gmaIosHeadersSha256=cc971f9c5e197bba82262424c7b5abcf8d7b895bfc8e59d474af696f28bebd59
umpIosHeadersSha256=02b6b1925be8a6cfc294478c1a6bb1dd4de70cd9e4f31cbbfb789ab4de7b2955

